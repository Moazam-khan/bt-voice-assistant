<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BT</title>
<style>
{{STYLES}}
</style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <defs>
          <radialGradient id="brandOrb" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#dbeafe"></stop>
            <stop offset="55%" stop-color="#2563eb"></stop>
            <stop offset="100%" stop-color="#1a2040"></stop>
          </radialGradient>
        </defs>
        <circle cx="12" cy="12" r="10" fill="url(#brandOrb)"></circle>
        <ellipse cx="8.5" cy="8" rx="3" ry="1.6" fill="rgba(255,255,255,0.55)"></ellipse>
      </svg>
      BT
    </div>
    <div class="header-clock" id="header-clock">&mdash;</div>
    <div class="header-right">
      <div class="header-weather" id="header-weather">
        <span class="header-weather-temp" id="header-weather-temp">&mdash;</span>
        <span id="header-weather-city"></span>
      </div>
      <button class="gear-btn" onclick="openConfigFolder()" title="Open config folder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <circle cx="12" cy="12" r="8" stroke-dasharray="2 2.5"></circle>
        </svg>
      </button>
    </div>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="logo-dot"></div>BT</div>
      <div class="card">
        <div class="card-title">Weather</div>
        <div class="weather-main">
          <span class="weather-temp" id="weather-temp">&mdash;</span>
          <span class="weather-desc" id="weather-desc">Loading&hellip;</span>
        </div>
        <div class="weather-city" id="weather-city"></div>
      </div>
      <div class="card">
        <div class="card-title">System</div>
        <div class="gauge-row">
          <div class="gauge-item">
            <svg class="gauge" viewBox="0 0 64 64">
              <circle class="gauge-track" cx="32" cy="32" r="26"></circle>
              <circle class="gauge-fill cpu" id="cpu-gauge" cx="32" cy="32" r="26"></circle>
            </svg>
            <div class="gauge-center" id="cpu-value">&mdash;%</div>
            <div class="gauge-name">CPU</div>
          </div>
          <div class="gauge-item">
            <svg class="gauge" viewBox="0 0 64 64">
              <circle class="gauge-track" cx="32" cy="32" r="26"></circle>
              <circle class="gauge-fill ram" id="ram-gauge" cx="32" cy="32" r="26"></circle>
            </svg>
            <div class="gauge-center" id="ram-value">&mdash;%</div>
            <div class="gauge-name">RAM</div>
          </div>
          <div class="gauge-item">
            <svg class="gauge" viewBox="0 0 64 64">
              <circle class="gauge-track" cx="32" cy="32" r="26"></circle>
              <circle class="gauge-fill disk" id="disk-gauge" cx="32" cy="32" r="26"></circle>
            </svg>
            <div class="gauge-center" id="disk-value">&mdash;%</div>
            <div class="gauge-name">DISK</div>
          </div>
        </div>
        <div class="stat-row"><span class="stat-label">Memory</span><span class="stat-value" id="ram-detail">&mdash;</span></div>
        <div class="stat-row"><span class="stat-label">Storage</span><span class="stat-value" id="disk-detail">&mdash;</span></div>
      </div>
      <div class="card">
        <div class="card-title">Session</div>
        <div class="stat-row"><span class="stat-label">Uptime</span><span class="stat-value" id="uptime">00:00:00</span></div>
        <div class="stat-row"><span class="stat-label">Wake word</span><span class="stat-value" id="wake-phrase">&mdash;</span></div>
        <div class="stat-row"><span class="stat-label">Model</span><span class="stat-value" id="model-name">&mdash;</span></div>
        <div class="stat-row"><span class="stat-label">Messages</span><span class="stat-value" id="message-count">0</span></div>
      </div>
    </aside>

    <main class="center-panel">
      <div class="center-backdrop">
        <div class="stars"></div>
        <div class="grid-floor"></div>
      </div>
      <div class="hex-accent"></div>
      <div class="hud-corner tl"></div>
      <div class="hud-corner tr"></div>
      <div class="hud-corner bl"></div>
      <div class="hud-corner br"></div>
      <div class="connection-badge" id="connection-badge">
        <div class="conn-dot"></div>
        <span id="connection-label">Connecting&hellip;</span>
      </div>
      <div class="orb-wrap">
        <div class="orb-sweep"></div>
        <div class="orb-ring-outer"></div>
        <div class="orb-ring"></div>
        <div class="orb" id="status-dot">
          <div class="orb-bars"><span></span><span></span><span></span></div>
        </div>
      </div>
      <h1 class="bt-title">BT</h1>
      <div class="status-text" id="status-label">Idle</div>
    </main>

    <section class="chat-panel">
      <div class="chat-header">
        <span class="chat-header-title"><span class="logo-dot"></span>Conversation</span>
        <button id="clear-btn" onclick="clearConversation()">Clear</button>
      </div>
      <div id="messages">
        <div id="empty-state">Type a message, or say &quot;Hey Jarvis&quot;, to talk to BT.</div>
      </div>
      <footer>
        <form id="text-form" onsubmit="return sendText(event)">
          <button type="button" id="mic-btn" class="icon-btn" disabled onclick="startListening()" title="Start listening">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
          </button>
          <input type="text" id="text-input" placeholder="Connecting&hellip;" disabled autocomplete="off" />
          <button type="submit" id="send-btn" class="icon-btn" disabled title="Send">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M2 21l21-9L2 3v7l15 2-15 2z"></path>
            </svg>
          </button>
        </form>
      </footer>
    </section>
  </div>

  <script>
{{SCRIPT}}
  </script>
</body>
</html>
