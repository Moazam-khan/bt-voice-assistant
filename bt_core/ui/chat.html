<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BT</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #2563eb;
    --user-bubble: #2563eb;
    --bt-bubble: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .status-dot.listening { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .status-dot.thinking { background: #eab308; box-shadow: 0 0 8px #eab308; }
  .status-dot.speaking { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  #status-label { font-size: 12px; color: var(--muted); margin-left: auto; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bt {
    align-self: flex-start;
    background: var(--bt-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #empty-state { margin: auto; text-align: center; color: var(--muted); font-size: 13px; padding: 0 24px; }
</style>
</head>
<body>
  <header>
    <div class="status-dot" id="status-dot"></div>
    <h1>BT</h1>
    <span id="status-label">Idle</span>
  </header>
  <div id="messages">
    <div id="empty-state">Say &quot;Hey Jarvis&quot; to start talking to BT.</div>
  </div>

  <script>
    function clearEmptyState() {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();
    }

    function scrollToBottom() {
      const el = document.getElementById('messages');
      el.scrollTop = el.scrollHeight;
    }

    function addUserMessage(text) {
      clearEmptyState();
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg user';
      div.innerHTML = '<div class="role">You</div>' + escapeHtml(text);
      container.appendChild(div);
      scrollToBottom();
    }

    function addBtMessage(text) {
      clearEmptyState();
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg bt';
      div.innerHTML = '<div class="role">BT</div>' + escapeHtml(text);
      container.appendChild(div);
      scrollToBottom();
    }

    function setStatus(status) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      dot.className = 'status-dot ' + status;
      const labels = { idle: 'Idle', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking' };
      label.textContent = labels[status] || status;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
