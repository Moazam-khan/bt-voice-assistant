<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BT</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #2563eb;
    --user-bubble: #2563eb;
    --bt-bubble: #1f2430;
    --error-bg: #2a1c1c;
    --error-border: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    position: relative;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60%;
    left: -10%;
    width: 220px;
    height: 220px;
    background: radial-gradient(circle, rgba(37, 99, 235, 0.18), transparent 70%);
    pointer-events: none;
  }
  header h1 { position: relative; font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  .orb {
    position: relative;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9aa3b2, var(--muted));
    box-shadow: 0 0 5px rgba(139, 147, 163, 0.4);
    transition: background 0.25s ease, box-shadow 0.25s ease;
  }
  .orb.listening {
    background: radial-gradient(circle at 35% 30%, #4ade80, #16a34a);
    box-shadow: 0 0 6px #22c55e, 0 0 16px rgba(34, 197, 94, 0.5);
    animation: orb-pulse 1.4s infinite ease-in-out;
  }
  .orb.thinking {
    background: radial-gradient(circle at 35% 30%, #fde047, #ca8a04);
    box-shadow: 0 0 6px #eab308, 0 0 16px rgba(234, 179, 8, 0.5);
    animation: orb-pulse 0.9s infinite ease-in-out;
  }
  .orb.speaking {
    background: radial-gradient(circle at 35% 30%, #60a5fa, var(--accent));
    box-shadow: 0 0 6px var(--accent), 0 0 16px rgba(37, 99, 235, 0.55);
    animation: orb-pulse 0.7s infinite ease-in-out;
  }
  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.35); }
  }
  .status-badge {
    position: relative;
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
  }
  #status-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: msg-in 0.18s ease-out;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bt {
    align-self: flex-start;
    background: var(--bt-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-left: 3px solid var(--error-border);
    border-bottom-left-radius: 4px;
  }
  .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
  .msg .timestamp { font-size: 10px; color: var(--muted); margin-top: 4px; opacity: 0.7; }
  .msg.user .timestamp { text-align: right; }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #empty-state { margin: auto; text-align: center; color: var(--muted); font-size: 13px; padding: 0 24px; }
  .typing-dots {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--bt-bubble);
    border: 1px solid var(--border);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    animation: msg-in 0.18s ease-out;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  footer {
    padding: 12px 18px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #text-form { display: flex; gap: 8px; }
  #text-input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  #text-input:focus { border-color: var(--accent); }
  #text-input:disabled { opacity: 0.5; }
  #send-btn, #start-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  #start-btn { width: 100%; background: var(--bt-bubble); border: 1px solid var(--border); }
  #send-btn:hover:not(:disabled), #start-btn:hover:not(:disabled) { background: #1d4ed8; }
  #start-btn:hover:not(:disabled) { background: #2a3040; }
  #send-btn:disabled, #start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>BT</h1>
    <div class="status-badge">
      <div class="orb" id="status-dot"></div>
      <span id="status-label">Idle</span>
    </div>
  </header>
  <div id="messages">
    <div id="empty-state">Type a message, or say &quot;Hey Jarvis&quot;, to talk to BT.</div>
  </div>
  <footer>
    <form id="text-form" onsubmit="return sendText(event)">
      <input type="text" id="text-input" placeholder="Connecting&hellip;" disabled autocomplete="off" />
      <button type="submit" id="send-btn" disabled>Send</button>
    </form>
    <button id="start-btn" disabled onclick="startListening()">Start listening</button>
  </footer>

  <script>
    function clearEmptyState() {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();
    }

    function scrollToBottom() {
      const el = document.getElementById('messages');
      el.scrollTop = el.scrollHeight;
    }

    function formatTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function hideTypingIndicator() {
      const existing = document.getElementById('typing-indicator');
      if (existing) existing.remove();
    }

    function showTypingIndicator() {
      if (document.getElementById('typing-indicator')) return;
      clearEmptyState();
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'typing-dots';
      div.id = 'typing-indicator';
      div.innerHTML = '<span></span><span></span><span></span>';
      container.appendChild(div);
      scrollToBottom();
    }

    function addMessage(role, cssClass, text) {
      hideTypingIndicator();
      clearEmptyState();
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg ' + cssClass;
      div.innerHTML =
        '<div class="role">' + role + '</div>' +
        escapeHtml(text) +
        '<div class="timestamp">' + formatTime() + '</div>';
      container.appendChild(div);
      scrollToBottom();
    }

    function addUserMessage(text) {
      addMessage('You', 'user', text);
    }

    function addBtMessage(text) {
      addMessage('BT', 'bt', text);
    }

    function addErrorMessage(text) {
      addMessage('BT', 'error', text);
    }

    function setStatus(status) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      dot.className = 'orb ' + status;
      const labels = { idle: 'Idle', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking' };
      label.textContent = labels[status] || status;

      if (status === 'thinking') {
        showTypingIndicator();
      } else {
        hideTypingIndicator();
      }

      const idle = status === 'idle';
      const startBtn = document.getElementById('start-btn');
      const textInput = document.getElementById('text-input');
      const sendBtn = document.getElementById('send-btn');
      if (bridgeReady) {
        startBtn.disabled = !idle;
        textInput.disabled = !idle;
        sendBtn.disabled = !idle;
        textInput.placeholder = idle ? 'Type a message...' : (labels[status] || status) + '…';
      }
      startBtn.textContent = idle ? 'Start listening' : labels[status] || status;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    let bridgeReady = false;

    function startListening() {
      if (bridgeReady) {
        window.pywebview.api.start_listening();
      }
    }

    function sendText(event) {
      event.preventDefault();
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (!text || !bridgeReady) {
        return false;
      }
      input.value = '';
      window.pywebview.api.send_text_message(text);
      return false;
    }

    window.addEventListener('pywebviewready', function () {
      bridgeReady = true;
      setStatus('idle');
    });
  </script>
</body>
</html>
