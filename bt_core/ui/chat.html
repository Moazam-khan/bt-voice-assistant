<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BT</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --sidebar: #12141a;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #2563eb;
    --user-bubble: #2563eb;
    --bt-bubble: #1f2430;
    --error-bg: #2a1c1c;
    --error-border: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .app-header {
    height: 46px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: var(--sidebar);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .app-header .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; letter-spacing: 0.03em; }
  .header-clock { color: var(--muted); font-variant-numeric: tabular-nums; }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-weather { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .header-weather .header-weather-temp { color: var(--text); font-weight: 600; }
  .gear-btn {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: 1px solid transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 0;
    border-radius: 50%;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .gear-btn svg { width: 15px; height: 15px; }
  .gear-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); border-color: var(--border); }
  .app-shell {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  /* --- Sidebar --- */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sidebar-header { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: 0.03em; }
  .sidebar-header .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .card-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .stat-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; font-size: 12px; }
  .stat-label { color: var(--muted); }
  .stat-value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .weather-main { display: flex; align-items: baseline; gap: 8px; }
  .weather-temp { font-size: 26px; font-weight: 700; }
  .weather-desc { font-size: 12px; color: var(--muted); text-transform: capitalize; }
  .weather-city { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .meter-track { height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); overflow: hidden; margin-top: 4px; }
  .meter-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), #60a5fa); transition: width 0.4s ease; }
  .stat-block { margin-bottom: 10px; }
  .stat-block:last-child { margin-bottom: 0; }
  .stat-block-top { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
  .stat-block-top .stat-label { color: var(--muted); }
  .stat-block-top .stat-value { font-weight: 600; }

  /* --- Center panel --- */
  .center-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 24px;
    overflow: hidden;
  }
  .center-panel::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 480px;
    height: 480px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(37, 99, 235, 0.10), transparent 65%);
    pointer-events: none;
  }
  .connection-badge {
    position: absolute;
    top: 18px;
    left: 18px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }
  .conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .connection-badge.online .conn-dot { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .connection-badge.online { color: #4ade80; }

  .orb-wrap {
    position: relative;
    width: 130px;
    height: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .orb-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    animation: ring-spin 16s linear infinite;
  }
  .orb-ring::after {
    content: '';
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    border: 1px dashed var(--border);
  }
  .orb-ring-outer {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(37, 99, 235, 0.15);
    animation: ring-spin 26s linear infinite reverse;
  }
  @keyframes ring-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .orb {
    position: relative;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9aa3b2, var(--muted));
    box-shadow: 0 0 12px rgba(139, 147, 163, 0.35);
    transition: background 0.25s ease, box-shadow 0.25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: orb-breathe 3s ease-in-out infinite;
  }
  .orb.listening {
    background: radial-gradient(circle at 35% 30%, #4ade80, #16a34a);
    box-shadow: 0 0 16px #22c55e, 0 0 40px rgba(34, 197, 94, 0.45);
    animation: orb-pulse 1.4s infinite ease-in-out;
  }
  .orb.thinking {
    background: radial-gradient(circle at 35% 30%, #fde047, #ca8a04);
    box-shadow: 0 0 16px #eab308, 0 0 40px rgba(234, 179, 8, 0.45);
    animation: orb-pulse 0.9s infinite ease-in-out;
  }
  .orb.speaking {
    background: radial-gradient(circle at 35% 30%, #60a5fa, var(--accent));
    box-shadow: 0 0 16px var(--accent), 0 0 40px rgba(37, 99, 235, 0.5);
    animation: orb-pulse 0.7s infinite ease-in-out;
  }
  @keyframes orb-breathe {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.06); opacity: 1; }
  }
  .orb-bars { display: none; gap: 3px; align-items: center; justify-content: center; }
  .orb.listening .orb-bars, .orb.speaking .orb-bars { display: flex; }
  .orb-bars span {
    width: 3px;
    height: 16px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 2px;
    animation: bar-bounce 0.9s infinite ease-in-out;
  }
  .orb-bars span:nth-child(2) { animation-delay: 0.15s; }
  .orb-bars span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bar-bounce {
    0%, 100% { transform: scaleY(0.35); }
    50% { transform: scaleY(1); }
  }
  @keyframes orb-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  .bt-title { font-size: 22px; font-weight: 700; letter-spacing: 0.08em; margin: 0; }
  .status-text { margin-top: 8px; font-size: 12px; color: var(--muted); font-weight: 600; }

  /* --- Chat panel --- */
  .chat-panel {
    width: 360px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
  }
  .chat-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #clear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  #clear-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: msg-in 0.18s ease-out;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bt {
    align-self: flex-start;
    background: var(--bt-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    border-left: 3px solid var(--error-border);
    border-bottom-left-radius: 4px;
  }
  .msg .role { font-size: 10px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
  .msg .timestamp { font-size: 10px; color: var(--muted); margin-top: 4px; opacity: 0.7; }
  .msg.user .timestamp { text-align: right; }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #empty-state { margin: auto; text-align: center; color: var(--muted); font-size: 12px; padding: 0 24px; }
  .typing-dots {
    align-self: flex-start;
    display: flex;
    gap: 4px;
    padding: 12px 16px;
    background: var(--bt-bubble);
    border: 1px solid var(--border);
    border-radius: 14px;
    border-bottom-left-radius: 4px;
    animation: msg-in 0.18s ease-out;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  footer {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }
  #text-form { display: flex; align-items: center; gap: 10px; }
  #text-input {
    flex: 1;
    padding: 11px 16px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: linear-gradient(160deg, #1a1e28, #14161c);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #text-input:focus {
    border-color: rgba(59, 130, 246, 0.45);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03), 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  #text-input:disabled { opacity: 0.5; }

  .icon-btn {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 13px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: linear-gradient(160deg, #232838, #171a22);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 2px 6px rgba(0, 0, 0, 0.35);
    transition: background 0.2s ease, color 0.2s ease, box-shadow 0.25s ease, transform 0.15s ease,
      border-color 0.2s ease;
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:hover:not(:disabled) {
    background: linear-gradient(160deg, #2a3042, #1c202b);
    color: var(--text);
    border-color: rgba(255, 255, 255, 0.12);
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 4px 12px rgba(0, 0, 0, 0.4);
  }
  .icon-btn:active:not(:disabled) { transform: translateY(0); }
  .icon-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  #send-btn {
    background: linear-gradient(160deg, #3b74f6, var(--accent));
    border-color: rgba(255, 255, 255, 0.12);
    color: white;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15), 0 2px 10px rgba(37, 99, 235, 0.35);
  }
  #send-btn:hover:not(:disabled) {
    background: linear-gradient(160deg, #4c82ff, #1d4ed8);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 4px 16px rgba(37, 99, 235, 0.5);
  }

  #mic-btn.listening {
    background: linear-gradient(160deg, #22c55e, #15803d);
    border-color: rgba(74, 222, 128, 0.5);
    color: white;
    animation: mic-pulse-green 1.6s infinite ease-in-out;
  }
  #mic-btn.thinking {
    background: linear-gradient(160deg, #eab308, #a16207);
    border-color: rgba(250, 204, 21, 0.5);
    color: white;
    animation: mic-pulse-amber 1s infinite ease-in-out;
  }
  #mic-btn.speaking {
    background: linear-gradient(160deg, #3b82f6, #1d4ed8);
    border-color: rgba(96, 165, 250, 0.5);
    color: white;
    animation: mic-pulse-blue 0.8s infinite ease-in-out;
  }
  @keyframes mic-pulse-green {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 0 rgba(34, 197, 94, 0); transform: scale(1); }
    50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 16px 2px rgba(34, 197, 94, 0.55); transform: scale(1.06); }
  }
  @keyframes mic-pulse-amber {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 0 rgba(234, 179, 8, 0); transform: scale(1); }
    50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 16px 2px rgba(234, 179, 8, 0.55); transform: scale(1.06); }
  }
  @keyframes mic-pulse-blue {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 0 0 rgba(37, 99, 235, 0); transform: scale(1); }
    50% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 0 16px 2px rgba(37, 99, 235, 0.55); transform: scale(1.06); }
  }
</style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><div class="logo-dot"></div>BT</div>
    <div class="header-clock" id="header-clock">&mdash;</div>
    <div class="header-right">
      <div class="header-weather" id="header-weather">
        <span class="header-weather-temp" id="header-weather-temp">&mdash;</span>
        <span id="header-weather-city"></span>
      </div>
      <button class="gear-btn" onclick="openConfigFolder()" title="Open config folder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <circle cx="12" cy="12" r="8" stroke-dasharray="2 2.5"></circle>
        </svg>
      </button>
    </div>
  </header>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header"><div class="logo-dot"></div>BT</div>
      <div class="card">
        <div class="card-title">Weather</div>
        <div class="weather-main">
          <span class="weather-temp" id="weather-temp">&mdash;</span>
          <span class="weather-desc" id="weather-desc">Loading&hellip;</span>
        </div>
        <div class="weather-city" id="weather-city"></div>
      </div>
      <div class="card">
        <div class="card-title">System</div>
        <div class="stat-block">
          <div class="stat-block-top"><span class="stat-label">CPU</span><span class="stat-value" id="cpu-value">&mdash;%</span></div>
          <div class="meter-track"><div class="meter-fill" id="cpu-meter" style="width: 0%"></div></div>
        </div>
        <div class="stat-block">
          <div class="stat-block-top"><span class="stat-label">RAM</span><span class="stat-value" id="ram-value">&mdash;%</span></div>
          <div class="meter-track"><div class="meter-fill" id="ram-meter" style="width: 0%"></div></div>
        </div>
        <div class="stat-row"><span class="stat-label">Memory</span><span class="stat-value" id="ram-detail">&mdash;</span></div>
      </div>
      <div class="card">
        <div class="card-title">Session</div>
        <div class="stat-row"><span class="stat-label">Uptime</span><span class="stat-value" id="uptime">00:00:00</span></div>
        <div class="stat-row"><span class="stat-label">Wake word</span><span class="stat-value" id="wake-phrase">&mdash;</span></div>
        <div class="stat-row"><span class="stat-label">Model</span><span class="stat-value" id="model-name">&mdash;</span></div>
        <div class="stat-row"><span class="stat-label">Messages</span><span class="stat-value" id="message-count">0</span></div>
      </div>
    </aside>

    <main class="center-panel">
      <div class="connection-badge" id="connection-badge">
        <div class="conn-dot"></div>
        <span id="connection-label">Connecting&hellip;</span>
      </div>
      <div class="orb-wrap">
        <div class="orb-ring-outer"></div>
        <div class="orb-ring"></div>
        <div class="orb" id="status-dot">
          <div class="orb-bars"><span></span><span></span><span></span></div>
        </div>
      </div>
      <h1 class="bt-title">BT</h1>
      <div class="status-text" id="status-label">Idle</div>
    </main>

    <section class="chat-panel">
      <div class="chat-header">
        <span>Conversation</span>
        <button id="clear-btn" onclick="clearConversation()">Clear</button>
      </div>
      <div id="messages">
        <div id="empty-state">Type a message, or say &quot;Hey Jarvis&quot;, to talk to BT.</div>
      </div>
      <footer>
        <form id="text-form" onsubmit="return sendText(event)">
          <button type="button" id="mic-btn" class="icon-btn" disabled onclick="startListening()" title="Start listening">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 11a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
          </button>
          <input type="text" id="text-input" placeholder="Connecting&hellip;" disabled autocomplete="off" />
          <button type="submit" id="send-btn" class="icon-btn" disabled title="Send">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M2 21l21-9L2 3v7l15 2-15 2z"></path>
            </svg>
          </button>
        </form>
      </footer>
    </section>
  </div>

  <script>
    let messageCount = 0;
    let uptimeStartMs = null;

    function clearEmptyState() {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();
    }

    function scrollToBottom() {
      const el = document.getElementById('messages');
      el.scrollTop = el.scrollHeight;
    }

    function formatTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function hideTypingIndicator() {
      const existing = document.getElementById('typing-indicator');
      if (existing) existing.remove();
    }

    function showTypingIndicator() {
      if (document.getElementById('typing-indicator')) return;
      clearEmptyState();
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'typing-dots';
      div.id = 'typing-indicator';
      div.innerHTML = '<span></span><span></span><span></span>';
      container.appendChild(div);
      scrollToBottom();
    }

    function addMessage(role, cssClass, text) {
      hideTypingIndicator();
      clearEmptyState();
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg ' + cssClass;
      div.innerHTML =
        '<div class="role">' + role + '</div>' +
        escapeHtml(text) +
        '<div class="timestamp">' + formatTime() + '</div>';
      container.appendChild(div);
      scrollToBottom();
    }

    function addUserMessage(text) {
      addMessage('You', 'user', text);
      messageCount += 1;
      document.getElementById('message-count').textContent = String(messageCount);
    }

    function addBtMessage(text) {
      addMessage('BT', 'bt', text);
    }

    function addErrorMessage(text) {
      addMessage('BT', 'error', text);
    }

    function setSessionInfo(wakePhrase, modelName) {
      document.getElementById('wake-phrase').textContent = wakePhrase;
      document.getElementById('model-name').textContent = modelName;
    }

    function setWeather(city, temp, description) {
      document.getElementById('weather-temp').textContent = temp;
      document.getElementById('weather-desc').textContent = description;
      document.getElementById('weather-city').textContent = city;
      document.getElementById('header-weather-temp').textContent = temp;
      document.getElementById('header-weather-city').textContent = city;
    }

    function setWeatherUnavailable() {
      document.getElementById('weather-temp').textContent = '—';
      document.getElementById('weather-desc').textContent = 'Unavailable';
      document.getElementById('weather-city').textContent = 'Check your internet connection';
      document.getElementById('header-weather-temp').textContent = '—';
      document.getElementById('header-weather-city').textContent = 'Unavailable';
    }

    function tickHeaderClock() {
      const now = new Date();
      const time = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const date = now.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
      document.getElementById('header-clock').textContent = time + '  |  ' + date;
    }

    function openConfigFolder() {
      if (bridgeReady) {
        window.pywebview.api.open_config_folder();
      }
    }

    function setSystemStats(cpuPercent, ramPercent, ramDetail) {
      document.getElementById('cpu-value').textContent = cpuPercent + '%';
      document.getElementById('cpu-meter').style.width = cpuPercent + '%';
      document.getElementById('ram-value').textContent = ramPercent + '%';
      document.getElementById('ram-meter').style.width = ramPercent + '%';
      document.getElementById('ram-detail').textContent = ramDetail;
    }

    function clearConversation() {
      const container = document.getElementById('messages');
      container.innerHTML = '<div id="empty-state">Type a message, or say &quot;Hey Jarvis&quot;, to talk to BT.</div>';
      messageCount = 0;
      document.getElementById('message-count').textContent = '0';
    }

    function formatUptime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(totalSeconds % 60).padStart(2, '0');
      return h + ':' + m + ':' + s;
    }

    function tickUptime() {
      if (uptimeStartMs === null) return;
      document.getElementById('uptime').textContent = formatUptime(Date.now() - uptimeStartMs);
    }

    function setStatus(status) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      dot.className = 'orb ' + status;
      const labels = {
        idle: 'Idle',
        listening: 'Listening for wake word…',
        thinking: 'Thinking…',
        speaking: 'Speaking…',
      };
      label.textContent = labels[status] || status;

      if (status === 'thinking') {
        showTypingIndicator();
      } else {
        hideTypingIndicator();
      }

      const idle = status === 'idle';
      const micBtn = document.getElementById('mic-btn');
      const textInput = document.getElementById('text-input');
      const sendBtn = document.getElementById('send-btn');
      if (bridgeReady) {
        micBtn.disabled = !idle;
        textInput.disabled = !idle;
        sendBtn.disabled = !idle;
        textInput.placeholder = idle ? 'Type a message...' : (labels[status] || status);
      }
      micBtn.className = 'icon-btn' + (idle ? '' : ' ' + status);
      micBtn.title = idle ? 'Start listening' : (labels[status] || status);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    let bridgeReady = false;

    function startListening() {
      if (bridgeReady) {
        window.pywebview.api.start_listening();
      }
    }

    function sendText(event) {
      event.preventDefault();
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (!text || !bridgeReady) {
        return false;
      }
      input.value = '';
      window.pywebview.api.send_text_message(text);
      return false;
    }

    window.addEventListener('pywebviewready', function () {
      bridgeReady = true;
      uptimeStartMs = Date.now();
      setInterval(tickUptime, 1000);
      tickUptime();
      const badge = document.getElementById('connection-badge');
      badge.classList.add('online');
      document.getElementById('connection-label').textContent = 'Online';
      setStatus('idle');
    });

    setInterval(tickHeaderClock, 1000);
    tickHeaderClock();
  </script>
</body>
</html>
