<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BT</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #2563eb;
    --user-bubble: #2563eb;
    --bt-bubble: #1f2430;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
  }
  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  .status-dot.listening { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .status-dot.thinking { background: #eab308; box-shadow: 0 0 8px #eab308; }
  .status-dot.speaking { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  #status-label { font-size: 12px; color: var(--muted); margin-left: auto; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bt {
    align-self: flex-start;
    background: var(--bt-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg .role { font-size: 11px; color: var(--muted); margin-bottom: 3px; font-weight: 600; }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #empty-state { margin: auto; text-align: center; color: var(--muted); font-size: 13px; padding: 0 24px; }
  footer {
    padding: 12px 18px 14px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #text-form { display: flex; gap: 8px; }
  #text-input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  #text-input:focus { border-color: var(--accent); }
  #text-input:disabled { opacity: 0.5; }
  #send-btn, #start-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  #start-btn { width: 100%; background: var(--bt-bubble); border: 1px solid var(--border); }
  #send-btn:hover:not(:disabled), #start-btn:hover:not(:disabled) { background: #1d4ed8; }
  #start-btn:hover:not(:disabled) { background: #2a3040; }
  #send-btn:disabled, #start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <div class="status-dot" id="status-dot"></div>
    <h1>BT</h1>
    <span id="status-label">Idle</span>
  </header>
  <div id="messages">
    <div id="empty-state">Type a message, or say &quot;Hey Jarvis&quot;, to talk to BT.</div>
  </div>
  <footer>
    <form id="text-form" onsubmit="return sendText(event)">
      <input type="text" id="text-input" placeholder="Connecting&hellip;" disabled autocomplete="off" />
      <button type="submit" id="send-btn" disabled>Send</button>
    </form>
    <button id="start-btn" disabled onclick="startListening()">Start listening</button>
  </footer>

  <script>
    function clearEmptyState() {
      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();
    }

    function scrollToBottom() {
      const el = document.getElementById('messages');
      el.scrollTop = el.scrollHeight;
    }

    function addUserMessage(text) {
      clearEmptyState();
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg user';
      div.innerHTML = '<div class="role">You</div>' + escapeHtml(text);
      container.appendChild(div);
      scrollToBottom();
    }

    function addBtMessage(text) {
      clearEmptyState();
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg bt';
      div.innerHTML = '<div class="role">BT</div>' + escapeHtml(text);
      container.appendChild(div);
      scrollToBottom();
    }

    function setStatus(status) {
      const dot = document.getElementById('status-dot');
      const label = document.getElementById('status-label');
      dot.className = 'status-dot ' + status;
      const labels = { idle: 'Idle', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking' };
      label.textContent = labels[status] || status;

      const idle = status === 'idle';
      const startBtn = document.getElementById('start-btn');
      const textInput = document.getElementById('text-input');
      const sendBtn = document.getElementById('send-btn');
      if (bridgeReady) {
        startBtn.disabled = !idle;
        textInput.disabled = !idle;
        sendBtn.disabled = !idle;
        textInput.placeholder = idle ? 'Type a message...' : (labels[status] || status) + '…';
      }
      startBtn.textContent = idle ? 'Start listening' : labels[status] || status;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    let bridgeReady = false;

    function startListening() {
      if (bridgeReady) {
        window.pywebview.api.start_listening();
      }
    }

    function sendText(event) {
      event.preventDefault();
      const input = document.getElementById('text-input');
      const text = input.value.trim();
      if (!text || !bridgeReady) {
        return false;
      }
      input.value = '';
      window.pywebview.api.send_text_message(text);
      return false;
    }

    window.addEventListener('pywebviewready', function () {
      bridgeReady = true;
      setStatus('idle');
    });
  </script>
</body>
</html>
